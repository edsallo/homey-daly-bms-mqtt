<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pair Daly BMS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #007aff;
    }
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #0051d5;
    }
    .error {
      color: #ff3b30;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>Add Daly BMS Device</h2>

  <div class="form-group">
    <label>Device Name</label>
    <input type="text" id="deviceName" placeholder="e.g. Garage BMS" value="Daly BMS">
    <div class="help-text">Enter a name for this device</div>
  </div>

  <div class="form-group">
    <label>IP Address</label>
    <input type="text" id="ipAddress" placeholder="192.168.1.100" value="">
    <div class="help-text">IP address of your Daly BMS ESP8266</div>
  </div>

  <div class="form-group">
    <label>Poll Interval (seconds)</label>
    <input type="number" id="pollInterval" placeholder="10" value="10" min="5" max="3600">
    <div class="help-text">How often to read data from BMS (5-3600 seconds)</div>
  </div>

  <div id="error" class="error"></div>

  <button onclick="saveSettings()">Add Device</button>

  <script>
    function saveSettings() {
      const deviceName = document.getElementById('deviceName').value;
      const ipAddress = document.getElementById('ipAddress').value;
      const pollInterval = parseInt(document.getElementById('pollInterval').value);

      if (!ipAddress) {
        document.getElementById('error').innerText = 'IP Address is required';
        return;
      }

      if (isNaN(pollInterval) || pollInterval < 5) {
        document.getElementById('error').innerText = 'Poll interval must be at least 5 seconds';
        return;
      }

      Homey.saveSettings({
        deviceName: deviceName,
        ipAddress: ipAddress,
        pollInterval: pollInterval
      });
    }
  </script>
</body>
</html>
